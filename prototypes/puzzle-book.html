<meta charset="utf-8">
<title>Logic Gym 謎題本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: 掌上遊戲機——最上面是寵物「腦腦」的小窩，中間是厚邊框的遊戲板，按鈕像實體按鍵會被按下去 */
:root {
  --bg: #e6f0ff;
  --dot: #cddcf5;
  --board: #ffffff;
  --ink: #23305a;
  --ink-soft: #66739c;
  --sun: #ffc93c;
  --sun-deep: #d99a00;
  --berry: #ff5d73;
  --mint: #2fbf8a;
  --grape: #7c5cff;
  --pet: #5fd3a8;
  --pet-deep: #2e9e77;
  --cell: #f4f7ff;
  --given: #e3e9fb;
  --font-display: "Baloo 2", "Noto Sans TC", system-ui, sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12172b; --dot: #1b2240; --board: #1c2340; --ink: #eef2ff; --ink-soft: #9aa6d6;
    --sun: #ffd25e; --sun-deep: #ffd25e; --berry: #ff7489; --mint: #4fe0aa; --grape: #9b84ff;
    --pet: #5fd3a8; --pet-deep: #8ff0c9; --cell: #232c50; --given: #2d3864; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12172b; --dot: #1b2240; --board: #1c2340; --ink: #eef2ff; --ink-soft: #9aa6d6;
  --sun: #ffd25e; --sun-deep: #ffd25e; --berry: #ff7489; --mint: #4fe0aa; --grape: #9b84ff;
  --pet: #5fd3a8; --pet-deep: #8ff0c9; --cell: #232c50; --given: #2d3864; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 2px, transparent 2.5px);
  background-size: 22px 22px;
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
}
.wrap {
  max-width: 540px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
  display: flex; flex-direction: column; gap: 14px;
}
.chunky { border: 3px solid var(--ink); border-radius: 18px; background: var(--board); box-shadow: 0 6px 0 var(--ink); }

/* 寵物小窩 */
.home { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 12px 14px; align-items: center; position: relative; }
.pet-box { width: 112px; height: 112px; position: relative; }
#pet { width: 112px; height: 112px; overflow: visible; }
.pet-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pet-name { font: 900 1.15rem var(--font-body); margin: 0; }
.pet-stage { font-size: .8rem; color: var(--ink-soft); font-weight: 700; }
.bubble { position: relative; background: var(--cell); border: 2px solid var(--ink); border-radius: 12px; padding: 4px 10px; font-weight: 700; font-size: .9rem; min-height: 2.1em; }
.meter { display: flex; align-items: center; gap: 8px; font: 800 .9rem var(--font-display); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 14px; border: 2px solid var(--ink); border-radius: 999px; background: var(--cell); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--sun); border-right: 2px solid var(--sun-deep); transition: width .6s cubic-bezier(.3,1.6,.5,1); }
.mute { position: absolute; top: 8px; right: 10px; border: 2px solid var(--ink); background: var(--board); color: var(--ink); border-radius: 10px; font-size: .95rem; width: 36px; height: 32px; cursor: pointer; }

/* 寵物動畫 */
.pet-body { transform-origin: 60px 100px; }
.happy .pet-body { animation: hop .6s ease; }
.oops .pet-body { animation: wobble .5s ease; }
.idle .pet-body { animation: breathe 3s ease-in-out infinite; }
.eyes { transform-origin: 60px 62px; animation: blink 4s infinite; }
@keyframes hop { 0%,100% { transform: translateY(0) scale(1,1); } 20% { transform: translateY(2px) scale(1.12,.86); } 50% { transform: translateY(-18px) scale(.94,1.08); } 80% { transform: translateY(0) scale(1.06,.94); } }
@keyframes wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
@keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.03,.97); } }
@keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.egg-wiggle { transform-origin: 60px 105px; animation: eggw 2.4s ease-in-out infinite; }
@keyframes eggw { 0%,80%,100% { transform: rotate(0); } 85% { transform: rotate(-6deg); } 90% { transform: rotate(6deg); } 95% { transform: rotate(-3deg); } }

/* 分頁按鍵 */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tab {
  font: 900 .95rem var(--font-body); color: var(--ink); background: var(--board);
  border: 3px solid var(--ink); border-radius: 14px; padding: 6px 2px; cursor: pointer;
  box-shadow: 0 4px 0 var(--ink); display: flex; flex-direction: column; align-items: center; line-height: 1.25;
  transition: transform .08s, box-shadow .08s;
}
.tab .ic { font-size: 1.2rem; }
.tab:active, .key:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.tab[aria-selected="true"] { background: var(--sun); color: #23305a; }
button:focus-visible, .cell:focus-visible { outline: 3px solid var(--berry); outline-offset: 2px; }

/* 遊戲板 */
.sheet { padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.sheet-head { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sheet-head h2 { margin: 0; font: 900 1.25rem var(--font-body); }
.qno { font: 800 .95rem var(--font-display); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.verified { font-size: .75rem; color: var(--mint); font-weight: 700; }
.status { min-height: 1.6em; font-weight: 900; text-align: center; }
.status.err { color: var(--berry); }
.keys { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.key {
  font: 900 .95rem var(--font-body); padding: 7px 14px; border-radius: 12px; cursor: pointer;
  border: 3px solid var(--ink); background: var(--board); color: var(--ink); box-shadow: 0 4px 0 var(--ink);
  transition: transform .08s, box-shadow .08s;
}
.key.go { background: var(--mint); color: #10241c; }
.key[aria-pressed="true"] { background: var(--berry); color: #fff; }

/* 教學 */
.howto { width: 100%; border: 2px dashed var(--ink-soft); border-radius: 12px; padding: 8px 12px; background: var(--cell); }
.howto summary { font-weight: 900; cursor: pointer; }
.howto ol { margin: 8px 0 4px; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px; font-size: .95rem; }
.howto b { color: var(--berry); }
.howto .tip { margin: 6px 0 2px; font-size: .9rem; background: var(--board); border-left: 5px solid var(--sun); padding: 4px 8px; border-radius: 4px; }
.demo { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin: 10px 0; }
.demo-row { display: flex; align-items: center; }
.demo-row .dc { width: 24px; height: 24px; border: 1px solid var(--ink-soft); background: var(--board); }
.demo-row .dc.on { background: var(--grape); }
.demo-row .dl { font: 800 .95rem var(--font-display); margin-right: 8px; min-width: 2.2em; text-align: right; }
.demo-cap { font-size: .85rem; color: var(--ink-soft); }

/* 數織 */
.nono { display: grid; touch-action: manipulation; user-select: none; }
.clue { font: 800 .95rem var(--font-display); display: flex; align-items: flex-end; justify-content: center; line-height: 1.05; padding: 2px; font-variant-numeric: tabular-nums; transition: opacity .3s; }
.clue.col { flex-direction: column; justify-content: flex-end; }
.clue.row { justify-content: flex-end; padding-right: 6px; gap: 5px; align-items: center; }
.clue.done { opacity: .3; }
.cell { width: var(--cs); height: var(--cs); border: 1px solid var(--ink-soft); background: var(--cell); cursor: pointer; padding: 0; position: relative; border-radius: 3px; }
.cell.filled { background: var(--grape); animation: pop .18s ease-out; }
.cell.x::after { content: "×"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--berry); font-weight: 900; font-size: calc(var(--cs) * .6); }
.nono.solved .cell.filled { background: var(--pic); animation: shine .5s ease-out both; animation-delay: calc(var(--d) * 25ms); }
.nono.solved .cell:not(.filled) { background: var(--board); border-color: transparent; }
.nono.solved .cell.x::after { content: none; }
@keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
@keyframes shine { 0% { transform: scale(1); } 50% { transform: scale(1.25); } 100% { transform: scale(1); } }

/* 一筆畫 */
#stroke-svg { width: min(100%, 360px); height: auto; touch-action: manipulation; }
.edge { stroke: var(--ink-soft); opacity: .35; stroke-width: 10; stroke-linecap: round; }
.edge.used { stroke: var(--grape); opacity: 1; stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw .25s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.node { fill: var(--board); stroke: var(--ink); stroke-width: 3; }
.node.cur { fill: var(--sun); }
.node.hint { stroke: var(--berry); stroke-width: 6; }
.node-hit { fill: transparent; cursor: pointer; }

/* 數獨 */
.sudoku { display: grid; grid-template-columns: repeat(4, var(--ss)); border: 3px solid var(--ink); border-radius: 8px; overflow: hidden; }
.scell { width: var(--ss); height: var(--ss); border: 1px solid var(--ink-soft); background: var(--cell); font: 800 1.7rem var(--font-display); color: var(--grape); cursor: pointer; padding: 0; }
.scell.given { background: var(--given); color: var(--ink); cursor: default; }
.scell.sel { box-shadow: inset 0 0 0 4px var(--sun); }
.scell.bad { color: var(--berry); }
.scell.c1 { border-right: 3px solid var(--ink); }
.scell.r1 { border-bottom: 3px solid var(--ink); }
.scell.pop { animation: pop .18s ease-out; }
.pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: min(100%, 320px); }
.pad .key { font: 800 1.35rem var(--font-display); padding: 4px 0; }
.pad .key.erase { font: 900 .9rem var(--font-body); }

/* 圖鑑 */
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; width: 100%; }
.dex-card { border: 2px solid var(--ink); border-radius: 12px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--cell); }
.dex-card canvas { width: 56px; height: 56px; image-rendering: pixelated; }
.dex-card span { font-size: .8rem; font-weight: 900; }
.dex-card.locked span { color: var(--ink-soft); }
.dex-q { width: 56px; height: 56px; border-radius: 10px; border: 2px dashed var(--ink-soft); display: grid; place-items: center; font: 800 1.8rem var(--font-display); color: var(--ink-soft); }
.dex-count { font: 800 1rem var(--font-display); }

/* 過關畫面 */
.overlay { position: fixed; inset: 0; background: rgba(18, 23, 43, .55); display: grid; place-items: center; z-index: 20; padding: 16px; }
.win-card { width: min(100%, 340px); padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; animation: rise .35s cubic-bezier(.3,1.5,.5,1); }
.win-card h3 { margin: 0; font: 900 1.8rem var(--font-body); }
.win-card p { margin: 0; font-weight: 700; }
.win-card .gain { font: 800 1.4rem var(--font-display); color: var(--sun-deep); }
.win-card canvas { width: 120px; height: 120px; image-rendering: pixelated; }
@keyframes rise { from { transform: translateY(40px) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
.shake { animation: wobble .3s; }
footer { font-size: .8rem; color: var(--ink-soft); text-align: center; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap">
  <section class="home chunky" aria-label="腦腦的小窩">
    <div class="pet-box"><svg id="pet" viewBox="0 0 120 120" aria-hidden="true"></svg></div>
    <div class="pet-info">
      <p class="pet-name" id="pet-name">神秘的蛋</p>
      <span class="pet-stage" id="pet-stage"></span>
      <div class="bubble" id="bubble">你撿到一顆會發光的蛋。每解開一題，牠就吃到一顆動腦星。蛋裡面是誰呢？</div>
      <div class="meter"><span>⭐ <span id="stars">0</span></span><div class="bar"><i id="bar"></i></div><span id="next-at"></span></div>
    </div>
    <button class="mute" id="mute" aria-label="音效開關">🔊</button>
  </section>

  <nav class="tabs" role="tablist" aria-label="謎題種類">
    <button class="tab" role="tab" id="tab-nono" aria-selected="true" data-game="nono"><span class="ic">🧩</span>數織</button>
    <button class="tab" role="tab" id="tab-stroke" aria-selected="false" data-game="stroke"><span class="ic">✏️</span>一筆畫</button>
    <button class="tab" role="tab" id="tab-sudoku" aria-selected="false" data-game="sudoku"><span class="ic">🔢</span>數獨</button>
    <button class="tab" role="tab" id="tab-dex" aria-selected="false" data-game="dex"><span class="ic">📖</span>圖鑑</button>
  </nav>

  <section class="sheet chunky" id="sheet" aria-live="polite"></section>

  <footer>試玩樣本 · 每一題都由程式產生並驗算過答案只有一個 · 進度只存在這台裝置</footer>
</div>
<canvas id="confetti" hidden></canvas>
<div class="overlay" id="overlay" hidden></div>

<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const rnd = n => Math.floor(Math.random() * n);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const save = store.get("lg-save-v2", { solved: { nono: 0, stroke: 0, sudoku: 0 }, stars: 0, dex: [], muted: false });
  const persist = () => store.set("lg-save-v2", save);
  const sheet = $("#sheet");
  let game = "nono";

  /* ---------- 圖鑑圖案（每一張都經程式驗算：塗法只有一種） ---------- */
  const PICS = [
    ["愛心", "#ff5d73", [".#.#.", "#####", "#####", ".###.", "..#.."]],
    ["房子", "#ff9f43", ["..#..", ".###.", "#####", ".#.#.", ".###."]],
    ["大樹", "#2fbf8a", ["..#..", ".###.", "#####", "..#..", "..#.."]],
    ["笑臉", "#ffc93c", [".#.#.", ".#.#.", ".....", "#...#", ".###."]],
    ["蘑菇", "#ff5d73", [".###.", "#####", "#.#.#", "..#..", ".###."]],
    ["雨傘", "#4d9fff", [".###.", "#####", "..#..", "..#..", ".##.."]],
    ["鈴鐺", "#ffc93c", ["..#..", ".###.", ".###.", "#####", "..#.."]],
    ["箭頭", "#7c5cff", ["..#..", ".###.", "#.#.#", "..#..", "..#.."]],
    ["鑰匙", "#d99a00", [".##..", "#..#.", ".##..", "..#..", "..##."]],
    ["皇冠", "#ffc93c", ["#.#.#", "#####", "#####", ".....", "#####"]],
    ["十字", "#ff5d73", ["..#..", "..#..", "#####", "..#..", "..#.."]],
    ["小貓", "#ff9f43", ["#....#", "##..##", "######", "#.##.#", "######", ".####."]],
    ["小魚", "#4d9fff", ["......", ".##..#", "####.#", "######", ".##..#", "......"]],
    ["火箭", "#7c5cff", ["..##..", ".####.", ".#..#.", ".####.", "######", "#.##.#"]],
    ["星星", "#ffc93c", ["...#...", "...#...", "#######", ".#####.", "..###..", ".##.##.", "##...##"]],
    ["兔子", "#ff8fb1", [".#...#.", ".#...#.", ".##.##.", ".#####.", "##.#.##", "#######", ".#####."]],
    ["汽車", "#ff5d73", [".......", "..###..", ".#####.", "#######", "#######", ".##.##.", "......."]],
    ["蝴蝶", "#7c5cff", ["##...##", "###.###", "#######", "..###..", "#######", "###.###", "##...##"]],
    ["花朵", "#ff8fb1", ["..###..", ".#####.", "..###..", "...#...", ".#.#.#.", "..###..", "...#..."]],
    ["烏龜", "#2fbf8a", ["..###..", ".#####.", "#######", "#######", ".#####.", ".#...#.", "......."]]
  ].map(([name, color, rows]) => ({ name, color, sol: rows.map(r => [...r].map(ch => ch === "#" ? 1 : 0)) }));

  function drawPic(canvas, pic, locked) {
    const n = pic.sol.length, s = 12; canvas.width = canvas.height = n * s;
    const ctx = canvas.getContext("2d"); ctx.clearRect(0, 0, n * s, n * s);
    const ink = getComputedStyle(document.documentElement).getPropertyValue("--ink-soft").trim();
    pic.sol.forEach((row, r) => row.forEach((v, c) => { if (v) { ctx.fillStyle = locked ? ink : pic.color; ctx.globalAlpha = locked ? .25 : 1; ctx.fillRect(c * s, r * s, s - 1, s - 1); } }));
    ctx.globalAlpha = 1;
  }

  /* ---------- 音效（程式合成，不用音檔） ---------- */
  let actx = null;
  function tone(freq, dur, type = "triangle", vol = .12, delay = 0) {
    if (save.muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
    } catch {}
  }
  const sfx = {
    tap: () => tone(620, .06),
    erase: () => tone(380, .06),
    wrong: () => { tone(200, .14, "square", .06); tone(160, .16, "square", .06, .08); },
    win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, "triangle", .14, i * .09)),
    evolve: () => [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, "sine", .14, i * .1))
  };
  $("#mute").textContent = save.muted ? "🔇" : "🔊";
  $("#mute").addEventListener("click", () => { save.muted = !save.muted; persist(); $("#mute").textContent = save.muted ? "🔇" : "🔊"; if (!save.muted) sfx.tap(); });

  /* ---------- 寵物「腦腦」 ---------- */
  const STAGES = [
    { at: 0, name: "神秘的蛋", label: "蛋" },
    { at: 3, name: "腦腦寶寶", label: "第 1 階段" },
    { at: 10, name: "腦腦", label: "第 2 階段 · 長出天線" },
    { at: 25, name: "探險家腦腦", label: "第 3 階段 · 戴上帽子" },
    { at: 50, name: "國王腦腦", label: "最終階段 · 戴上皇冠" }
  ];
  const stageOf = s => STAGES.reduce((k, st, i) => s >= st.at ? i : k, 0);
  function petSVG(stage, stars, mood) {
    if (stage === 0) {
      const cracks = Math.min(stars, 2);
      return `<g class="egg-wiggle">
        <ellipse cx="60" cy="68" rx="34" ry="42" fill="#fff6dc" stroke="#23305a" stroke-width="3"/>
        <circle cx="46" cy="52" r="6" fill="#7c5cff" opacity=".7"/><circle cx="72" cy="80" r="8" fill="#5fd3a8" opacity=".8"/><circle cx="70" cy="46" r="4" fill="#ffc93c"/>
        ${cracks >= 1 ? `<path d="M40 64 l8 6 l6 -7 l7 7" fill="none" stroke="#23305a" stroke-width="3" stroke-linecap="round"/>` : ""}
        ${cracks >= 2 ? `<path d="M61 70 l8 -6 l7 8 l8 -5" fill="none" stroke="#23305a" stroke-width="3" stroke-linecap="round"/>` : ""}
      </g>`;
    }
    const big = stage >= 2 ? 1 : .82;
    const mouth = mood === "happy" ? `<path d="M50 78 q10 12 20 0 z" fill="#23305a"/>` : mood === "oops" ? `<ellipse cx="60" cy="80" rx="5" ry="6" fill="#23305a"/>` : `<path d="M51 78 q9 7 18 0" fill="none" stroke="#23305a" stroke-width="3" stroke-linecap="round"/>`;
    return `<g class="pet-body"><g transform="translate(60 100) scale(${big}) translate(-60 -100)">
      ${stage >= 4 ? `<path d="M30 70 q-14 30 6 38 h48 q20 -8 6 -38 z" fill="#ff5d73" stroke="#23305a" stroke-width="3"/>` : ""}
      ${stage >= 2 ? `<path d="M60 30 q-4 -12 4 -18" fill="none" stroke="#23305a" stroke-width="3" stroke-linecap="round"/><path d="M64 4 l3 6 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1 z" fill="#ffc93c" stroke="#23305a" stroke-width="2"/>` : ""}
      <path d="M22 78 q0 -46 38 -48 q38 2 38 48 q0 28 -38 28 q-38 0 -38 -28 z" fill="#5fd3a8" stroke="#23305a" stroke-width="3"/>

    $("#hint", sheet).addEventListener("click", () => {
      pz.odd.forEach(n => circles[n].classList.add("hint")); sfx.tap();
      status.className = "status"; status.textContent = pz.odd.length ? "紅框的點連著「單數」條線。從其中一個出發，就會在另一個結束。" : "每個點都連著雙數條線，從哪裡出發都可以。";
    });
  }

  /* ---------- 4×4 數獨 ---------- */
  function sudokuSolutions(g, limit = 2) {
    let count = 0; const a = g.slice();
    (function go() {
      if (count >= limit) return; const i = a.indexOf(0); if (i < 0) { count++; return; }
      const r = Math.floor(i / 4), c = i % 4, br = r - r % 2, bc = c - c % 2;
      for (let v = 1; v <= 4; v++) {
        let ok = true;
        for (let k = 0; k < 4 && ok; k++) if (a[r * 4 + k] === v || a[k * 4 + c] === v) ok = false;
        for (let y = br; y < br + 2 && ok; y++) for (let x = bc; x < bc + 2; x++) if (a[y * 4 + x] === v) ok = false;
        if (ok) { a[i] = v; go(); a[i] = 0; if (count >= limit) return; }
      }
    })();
    return count;
  }
  function makeSudoku(L) {
    const base = [1,2,3,4, 3,4,1,2, 2,1,4,3, 4,3,2,1], digits = shuffle([1, 2, 3, 4]);
    let g = base.map(v => digits[v - 1]);
    const rows = [...shuffle([0, 1]), ...shuffle([2, 3])], bands = Math.random() < .5 ? [0, 1, 2, 3] : [2, 3, 0, 1];
    const cols = [...shuffle([0, 1]), ...shuffle([2, 3])], stacks = Math.random() < .5 ? [0, 1, 2, 3] : [2, 3, 0, 1];
    g = Array.from({ length: 16 }, (_, i) => g[rows[bands[Math.floor(i / 4)]] * 4 + cols[stacks[i % 4]]]);
    if (Math.random() < .5) g = Array.from({ length: 16 }, (_, i) => g[(i % 4) * 4 + Math.floor(i / 4)]);
    const sol = g.slice(), puzzle = g.slice(), target = L <= 2 ? 8 : L <= 5 ? 6 : 4;
    for (const i of shuffle([...Array(16).keys()])) {
      if (puzzle.filter(Boolean).length <= target) break;
      const keep = puzzle[i]; puzzle[i] = 0; if (sudokuSolutions(puzzle) !== 1) puzzle[i] = keep;
    }
    return { sol, puzzle, unique: sudokuSolutions(puzzle) === 1 };
  }
  function startSudoku() {
    const L = save.solved.sudoku + 1, pz = makeSudoku(L), state = pz.puzzle.slice();
    let sel = state.indexOf(0), finished = false;
    const ss = Math.min(70, Math.floor((Math.min(innerWidth, 540) - 90) / 4));
    sheet.innerHTML = `
      <div class="sheet-head"><h2>🔢 數獨</h2><span class="qno">第 ${L} 題 · 提示 ${pz.puzzle.filter(Boolean).length} 格</span></div>
      ${howto("sudoku", HOWTO.sudoku)}
      <div class="sudoku" id="sudoku" style="--ss:${ss}px"></div>
      <div class="pad" id="pad">${[1, 2, 3, 4].map(v => `<button class="key" id="pad-${v}" data-v="${v}">${v}</button>`).join("")}<button class="key erase" id="pad-0" data-v="0">擦掉</button></div>
      <div class="keys"><button class="key" id="hint">💡 提示一格</button></div>
      <div class="status" id="status"></div>
      <span class="verified">${pz.unique ? "✓ 程式已驗算：只有一個解" : "⚠ 驗算失敗"}</span>`;
    const box = $("#sudoku", sheet), cells = [];
    for (let i = 0; i < 16; i++) {
      const b = document.createElement("button"), r = Math.floor(i / 4), c = i % 4;
      b.className = "scell" + (pz.puzzle[i] ? " given" : "") + (c === 1 ? " c1" : "") + (r === 1 ? " r1" : "");
      b.id = "sc-" + i; b.setAttribute("aria-label", `第 ${r + 1} 列第 ${c + 1} 格`);
      b.addEventListener("click", () => { if (!pz.puzzle[i] && !finished) { sel = i; sfx.tap(); paint(); } });
      box.appendChild(b); cells.push(b);
    }
    function conflict(i) {
      const v = state[i]; if (!v) return false; const r = Math.floor(i / 4), c = i % 4, br = r - r % 2, bc = c - c % 2;
      for (let k = 0; k < 16; k++) { if (k === i || state[k] !== v) continue; const kr = Math.floor(k / 4), kc = k % 4; if (kr === r || kc === c || (kr - kr % 2 === br && kc - kc % 2 === bc)) return true; }
      return false;
    }
    function paint(popIdx) { cells.forEach((b, i) => { b.textContent = state[i] || ""; b.classList.toggle("sel", i === sel && !finished); b.classList.toggle("bad", !pz.puzzle[i] && conflict(i)); b.classList.toggle("pop", i === popIdx); }); }
    function set(i, v) {
      state[i] = v; paint(i);
      if (v && conflict(i)) oops(cells[i]); else (v ? sfx.tap : sfx.erase)();
      if (state.every((x, k) => x === pz.sol[k])) { finished = true; paint(); setTimeout(() => win({ title: "全部填對了！", text: "每一列、每一行、每一格都沒有重複！", onNext: startSudoku }), reduced ? 0 : 300); }
    }
    $("#pad", sheet).addEventListener("click", e => { const v = e.target.closest("button")?.dataset.v; if (v === undefined || finished || sel < 0 || pz.puzzle[sel]) return; set(sel, Number(v)); });
    $("#hint", sheet).addEventListener("click", () => { if (finished) return; const wrong = state.map((v, i) => i).filter(i => state[i] !== pz.sol[i]); if (!wrong.length) return; const i = wrong[rnd(wrong.length)]; sel = i; set(i, pz.sol[i]); });
    paint();
  }

  /* ---------- 圖鑑 ---------- */
  function startDex() {
    sheet.innerHTML = `
      <div class="sheet-head"><h2>📖 圖鑑</h2><span class="dex-count">${save.dex.length} / ${PICS.length}</span></div>
      <p style="margin:0;width:100%;font-size:.9rem;color:var(--ink-soft)">玩數織拼出圖案，就會收進這裡。問號裡面藏著什麼？拼出來才知道！</p>
      <div class="dex" id="dex"></div>`;
    const box = $("#dex", sheet);
    PICS.forEach(p => {
      const got = save.dex.includes(p.name);
      const card = document.createElement("div"); card.className = "dex-card" + (got ? "" : " locked");
      const label = document.createElement("span"); label.textContent = got ? p.name : `${p.sol.length}×${p.sol.length}`;
      if (got) { const cv = document.createElement("canvas"); drawPic(cv, p); card.append(cv, label); }
      else { const q = document.createElement("div"); q.className = "dex-q"; q.textContent = "?"; card.append(q, label); }
      box.appendChild(card);
    });
  }

  const starters = { nono: startNono, stroke: startStroke, sudoku: startSudoku, dex: startDex };
  function selectTab(g) {
    game = g;
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x.dataset.game === g));
    starters[g]();
  }
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { sfx.tap(); selectTab(t.dataset.game); }));
  renderPet("idle", save.stars ? "今天也一起動腦吧！" : undefined);
  selectTab("nono");
  if (location.hash === "#selftest") window.__lgTest = { PICS, countNonoSolutions, cluesOf, makeRandomNono, makeStroke, hasEulerPath, makeSudoku, sudokuSolutions };
})();
</script>
